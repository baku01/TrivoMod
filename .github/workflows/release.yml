name: Build, Version & Release (TrivoMod)

on:
  push:
    branches:
      - main
      - master
    paths:
      - "trivomod/**"
      - "assets/AppIcon.*"
      - ".github/workflows/release.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de incremento de versão (auto usa Conventional Commits)"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      prerelease:
        description: "Marcar como pré-lançamento (prerelease)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trivomod-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Testes (${{ matrix.os }})
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip release]') &&
      github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Executar suíte de testes
        working-directory: trivomod
        run: npm test

  version:
    name: Versionar e criar tag
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      ref: ${{ steps.ver.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolver ou incrementar versão
        id: ver
        env:
          BUMP_MODE: ${{ inputs.bump || 'auto' }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_VERSION="$(node trivomod/tools/bump-version.js "${BUMP_MODE}")"
          TAG="v${NEW_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trivomod/package.json trivomod/src/version.js
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "${TAG}" -m "TrivoMod ${TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${TAG}"

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Compilar instalador macOS (.dmg Universal)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compilar janela nativa e launcher (arm64 + x86_64)
        run: |
          mkdir -p dist-mac/bin
          swiftc -O -target arm64-apple-macos13.0 trivomod/installer/window-mac.swift -o dist-mac/bin/window-arm64
          swiftc -O -target x86_64-apple-macos13.0 trivomod/installer/window-mac.swift -o dist-mac/bin/window-x86_64
          lipo -create dist-mac/bin/window-arm64 dist-mac/bin/window-x86_64 -output dist-mac/bin/trivomod-window-darwin

          swiftc -O -target arm64-apple-macos13.0 trivomod/installer/launcher-mac.swift -o dist-mac/bin/launcher-arm64
          swiftc -O -target x86_64-apple-macos13.0 trivomod/installer/launcher-mac.swift -o dist-mac/bin/launcher-x86_64
          lipo -create dist-mac/bin/launcher-arm64 dist-mac/bin/launcher-x86_64 -output dist-mac/bin/TrivoModInstaller

          chmod +x dist-mac/bin/trivomod-window-darwin dist-mac/bin/TrivoModInstaller
          lipo -info dist-mac/bin/trivomod-window-darwin dist-mac/bin/TrivoModInstaller

      - name: Montar TrivoMod Installer.app e gerar .dmg Universal
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          NODE_VER="$(node -v)"
          APP="dist-mac/dmg-root/TrivoMod Installer.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources/app/installer/bin" out dist-mac/node

          # Embute Node.js oficial (arm64 e x86_64) para funcionar sem Node instalado no Mac do usuário
          curl -fsSL "https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-darwin-arm64.tar.gz" -o dist-mac/node/arm64.tgz
          curl -fsSL "https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-darwin-x64.tar.gz" -o dist-mac/node/x64.tgz
          tar -xzf dist-mac/node/arm64.tgz -C dist-mac/node "node-${NODE_VER}-darwin-arm64/bin/node"
          tar -xzf dist-mac/node/x64.tgz -C dist-mac/node "node-${NODE_VER}-darwin-x64/bin/node"
          cp "dist-mac/node/node-${NODE_VER}-darwin-arm64/bin/node" "${APP}/Contents/Resources/node-arm64"
          cp "dist-mac/node/node-${NODE_VER}-darwin-x64/bin/node" "${APP}/Contents/Resources/node-x86_64"
          chmod +x "${APP}/Contents/Resources/node-arm64" "${APP}/Contents/Resources/node-x86_64"

          # Executável nativo + ícone da Arara Pirata + arquivos do TrivoMod
          cp dist-mac/bin/TrivoModInstaller "${APP}/Contents/MacOS/TrivoModInstaller"
          cp assets/AppIcon.icns "${APP}/Contents/Resources/AppIcon.icns"
          cp -R trivomod/bin trivomod/src trivomod/package.json trivomod/README.md "${APP}/Contents/Resources/app/"
          cp trivomod/installer/*.js "${APP}/Contents/Resources/app/installer/"
          cp -R trivomod/installer/ui "${APP}/Contents/Resources/app/installer/"
          cp dist-mac/bin/trivomod-window-darwin "${APP}/Contents/Resources/app/installer/bin/trivomod-window-darwin"
          chmod +x "${APP}/Contents/Resources/app/bin/trivomod.js" "${APP}/Contents/Resources/app/installer/bin/trivomod-window-darwin"

          cat > "${APP}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>TrivoMod Installer</string>
            <key>CFBundleDisplayName</key>
            <string>TrivoMod Installer</string>
            <key>CFBundleIdentifier</key>
            <string>com.trivomod.installer</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>TrivoModInstaller</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "${APP}"
          ln -s /Applications dist-mac/dmg-root/Applications
          hdiutil create -volname "TrivoMod ${TAG}" -srcfolder dist-mac/dmg-root -ov -format UDZO "out/TrivoMod-Installer-${TAG}-macos-universal.dmg"
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: out/*
          if-no-files-found: error

  build-windows:
    name: Compilar instalador Windows (.exe standalone)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compilar TrivoMod-Installer.exe (sem dependência de Node.js)
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path stage-win\installer, out | Out-Null
          Copy-Item -Recurse trivomod\bin, trivomod\src, trivomod\package.json, trivomod\README.md stage-win\
          Copy-Item trivomod\installer\*.js stage-win\installer\
          Copy-Item -Recurse trivomod\installer\ui stage-win\installer\
          Copy-Item (Get-Command node).Source stage-win\node.exe

          Compress-Archive -Path stage-win\* -DestinationPath payload.zip -CompressionLevel Optimal

          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $exe = "out\TrivoMod-Installer-$env:TAG-windows-x64.exe"
          & $csc /nologo /target:winexe /optimize+ `
            /win32icon:assets\AppIcon.ico `
            /resource:payload.zip,TrivoModPayload.zip `
            /r:System.IO.Compression.FileSystem.dll `
            /r:System.Windows.Forms.dll `
            /out:$exe `
            trivomod\installer\launcher-win.cs

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item $exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/*
          if-no-files-found: error

  build-linux:
    name: Empacotar instalador Linux (.tar.gz standalone)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Empacotar TrivoMod para Linux (com Node.js embutido)
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          STAGE="stage-linux/TrivoMod"
          mkdir -p "${STAGE}/installer" "${STAGE}/runtime" out
          cp -R trivomod/bin trivomod/src trivomod/package.json trivomod/README.md "${STAGE}/"
          cp trivomod/installer/*.js "${STAGE}/installer/"
          cp -R trivomod/installer/ui "${STAGE}/installer/"
          cp "$(which node)" "${STAGE}/runtime/node"
          chmod +x "${STAGE}/bin/trivomod.js" "${STAGE}/runtime/node"

          cat > "${STAGE}/instalar-trivomod.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "${DIR}/runtime/node" "${DIR}/bin/trivomod.js" gui "$@"
          SH
          chmod +x "${STAGE}/instalar-trivomod.sh"

          tar -C stage-linux -czf "out/TrivoMod-Installer-${TAG}-linux-x64.tar.gz" TrivoMod
          ls -lh out/

      # Pacote que o atualizador automático do mod baixa (o SHA256SUMS.txt da release o cobre).
      - name: Gerar pacote do runtime (atualização automática)
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          node trivomod/tools/build-runtime.js out
          test -f "out/trivomod-runtime-${TAG}.json.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: out/*
          if-no-files-found: error

  release:
    name: Publicar GitHub Release
    needs: [version, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Gerar SHA256SUMS.txt
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Criar ou atualizar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          EXTRA_FLAGS=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          if gh release view "${TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" artifacts/* --repo "${GH_REPO}" --clobber
          else
            gh release create "${TAG}" artifacts/* \
              --repo "${GH_REPO}" \
              --title "TrivoMod ${TAG}" \
              --generate-notes \
              "${EXTRA_FLAGS[@]}"
          fi
