name: CI (TrivoMod)

on:
  pull_request:
    paths:
      - "trivomod/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Executar testes
        working-directory: trivomod
        run: npm test
      - name: Verificar compilação universal da janela e launcher (macOS)
        if: runner.os == 'macOS'
        run: |
          swiftc -O -target arm64-apple-macos13.0 trivomod/installer/window-mac.swift -o /tmp/tm-arm64
          swiftc -O -target x86_64-apple-macos13.0 trivomod/installer/window-mac.swift -o /tmp/tm-x86_64
          lipo -create /tmp/tm-arm64 /tmp/tm-x86_64 -output /tmp/tm-universal
          swiftc -O -target arm64-apple-macos13.0 trivomod/installer/launcher-mac.swift -o /tmp/tm-l-arm64
          swiftc -O -target x86_64-apple-macos13.0 trivomod/installer/launcher-mac.swift -o /tmp/tm-l-x86_64
          lipo -create /tmp/tm-l-arm64 /tmp/tm-l-x86_64 -output /tmp/tm-launcher
          lipo -info /tmp/tm-universal /tmp/tm-launcher
      - name: Verificar compilação do launcher .exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Content -Path dummy.txt -Value "ok"
          Compress-Archive -Path dummy.txt -DestinationPath dummy.zip
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ `
            /win32icon:assets\AppIcon.ico `
            /resource:dummy.zip,TrivoModPayload.zip `
            /r:System.IO.Compression.FileSystem.dll `
            /r:System.Windows.Forms.dll `
            /out:test-launcher.exe `
            trivomod\installer\launcher-win.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test da extração do launcher .exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke\bin | Out-Null
          Copy-Item (Get-Command node).Source smoke\node.exe
          Set-Content -Path smoke\bin\trivomod.js -Value "process.exit(0);"
          Compress-Archive -Path smoke\* -DestinationPath smoke.zip
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ `
            /resource:smoke.zip,TrivoModPayload.zip `
            /r:System.IO.Compression.FileSystem.dll `
            /r:System.Windows.Forms.dll `
            /out:smoke-launcher.exe `
            trivomod\installer\launcher-win.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $runtime = Join-Path $env:LOCALAPPDATA "TrivoMod\installer-runtime"
          if (Test-Path $runtime) { Remove-Item -Recurse -Force $runtime }

          # Duas execuções: primeira extrai, segunda reutiliza o runtime marcado com .ready.
          foreach ($i in 1..2) {
            $p = Start-Process -FilePath .\smoke-launcher.exe -PassThru
            if (-not $p.WaitForExit(60000)) {
              $p.Kill()
              throw "Launcher travou na execução $i (provável MessageBox de erro)."
            }
            $marker = Get-ChildItem -Path $runtime -Recurse -Force -Filter .ready | Select-Object -First 1
            if (-not $marker) { throw "Marcador .ready ausente após execução $i." }
            Write-Host "Execução ${i}: OK ($($marker.FullName))"
          }
